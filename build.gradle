plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'CarritoCheckout'
version = '0.0.1-SNAPSHOT'
description = 'CarritoCheckoutService'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.apache.commons:commons-lang3:3.16.0'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'io.rest-assured:json-path:5.4.0'
    testImplementation 'io.rest-assured:xml-path:5.4.0'

}

// Configuración de tests para evitar UseAppCDS y habilitar Mockito
tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // Limpiar argumentos problemáticos heredados
    jvmArgs = jvmArgs.findAll { !it.contains("UseAppCDS") }

    // Agregar Java agent para Mockito inline
    doFirst {
        configurations.testRuntimeClasspath.files.each { file ->
            if (file.name.contains("byte-buddy-agent")) {
                jvmArgs += ["-javaagent:${file.absolutePath}"]
            }
        }
    }
}

bootJar {
    archiveFileName = 'app.jar'
}
